<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SauleTrust - Finance & Technology</title>
<meta name="description" content="AI powered financial solution">
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Source+Sans+Pro:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root { --pink: #ff0069; --black: #060606; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--black);
    color: #fff;
    font-family: 'Source Sans Pro', arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 20px 5vw 60px;
  }
  .hero {
    min-height: 72vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .sun {
    width: min(62vw, 360px);
    aspect-ratio: 1;
    border-radius: 50%;
    background: var(--pink);
    box-shadow: 0 0 55px 10px rgba(255, 0, 105, 0.26), 0 0 150px 40px rgba(255, 0, 105, 0.10);
    transition: all 0.4s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 56px;
  }
  .sun:hover {
    box-shadow: 0 0 110px 26px rgba(255, 0, 105, 1), 0 0 260px 90px rgba(255, 0, 105, 0.55);
  }
  .sun img { width: 72%; height: auto; }
  h1 {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: clamp(34px, 5.5vw, 58px);
    font-weight: 400;
    letter-spacing: 0.5px;
  }
  p.tagline {
    font-size: 17px;
    font-weight: 300;
    margin-top: 14px;
    opacity: 0.85;
    letter-spacing: 0.5px;
  }
  section { width: min(420px, 86vw); }
  section.social { margin-top: 64px; }
  h2 {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 21px;
    font-weight: 400;
    margin-bottom: 22px;
  }
  section.social a {
    color: #fff; text-decoration: none; margin: 0 14px; font-size: 14px;
    letter-spacing: 1px; border-bottom: 1px solid rgba(255,255,255,0.35); padding-bottom: 2px;
  }
  section.social a:hover { border-bottom-color: #fff; }
  section.app { width: min(760px, 92vw); margin-top: 64px; }
  section.app iframe {
    width: 100%; height: 640px; border: 1px solid rgba(255,255,255,0.16);
    border-radius: 10px; background: #101214;
  }
  section.app .caveat { font-size: 12.5px; opacity: 0.6; margin-top: 10px; font-style: italic; }
  footer {
    padding: 22px 5vw;
    font-size: 12.5px;
    opacity: 0.55;
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
</style>
</head>
<body>
  <main>
    <div class="hero">
      <div class="sun"><img src="logo.png" alt="SauleTrust"></div>
      <h1>Finance &amp; Technology</h1>
      <p class="tagline">AI powered financial solution</p>
    </div>
    <section class="social">
      <h2>Follow us on social for updates.</h2>
      <a href="https://www.instagram.com/sauletrust/">Instagram</a>
      <a href="https://www.linkedin.com/company/sauletrust/">LinkedIn</a>
      <a href="https://www.x.com/sauletrust">X</a>
    </section>
    <section class="app">
      <h2>RE-agent</h2>
      <iframe src="https://hk-building-detective.vercel.app/" title="RE-agent - public records lookup" loading="lazy"></iframe>
      <div class="caveat">checks public Buildings Department order records (Hong Kong for now). a lookup, not a full assessment.</div>
    </section>
  </main>
  <footer>
    <span>Copyright &copy; 2026 sauletrust.com - All Rights Reserved.</span>
  </footer>
</body>
</html>
